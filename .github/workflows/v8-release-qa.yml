name: V9 Integration Release QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run V9 deterministic QA
        run: python3 scripts/v9_qa.py

      - name: Run V9 privacy allowlist QA
        run: python3 scripts/v9_privacy_qa.py

      - name: Validate JavaScript and integrated identity controls
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q '^justiceforgina.org$' CNAME
          grep -q '^8f6c2eaf70bd4d9fa3940aaab0d428c7$' 8f6c2eaf70bd4d9fa3940aaab0d428c7.txt
          grep -q 'Sitemap: https://justiceforgina.org/sitemap.xml' robots.txt
          grep -q 'https://justiceforgina.org/gina-gazvoda.html' sitemap.xml
          grep -q 'https://justiceforgina.org/documents/' sitemap.xml
          grep -qi 'Grant Gazvoda' index.html
          grep -qi '#JusticeForGina' index.html
          grep -qi 'TikTok @c5corvetteguy' press.html
          test -s .github/workflows/indexnow-submit.yml
          test -s .github/workflows/site-health-check.yml
          test -s DNS_RECOVERY.md
          test -s SEO_EXPOSURE_RUNBOOK.md

      - name: Validate JSON-LD, manifest, and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          manifest = json.loads(Path('site.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('start_url') != './' or manifest.get('id') != './' or manifest.get('scope') != './':
              raise SystemExit('Manifest must preserve project-path-compatible relative settings.')
          ET.parse('sitemap.xml')

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_json_ld = False
                  self.buffers = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('type') == 'application/ld+json':
                      self.in_json_ld = True
                      self.buffers.append('')
              def handle_data(self, data):
                  if self.in_json_ld:
                      self.buffers[-1] += data
              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_json_ld:
                      self.in_json_ld = False

          for page in ('index.html', 'gina-gazvoda.html', 'press.html'):
              parser = JsonLdParser()
              parser.feed(Path(page).read_text(encoding='utf-8'))
              if not parser.buffers:
                  raise SystemExit(f'{page}: missing JSON-LD')
              for payload in parser.buffers:
                  json.loads(payload)
          print('Integrated JavaScript, identity, JSON-LD, manifest, and sitemap checks passed.')
          PY
