name: V9 Contact Privacy Fix

on:
  push:
    branches:
      - redesign/v9-high-profile-2026-08-01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite-public-contact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: redesign/v9-high-profile-2026-08-01

      - name: Rewrite public contact data
        run: python3 scripts/apply_public_contact_privacy.py

      - name: Commit source privacy cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No public contact changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' 'documents/**/*.html'
          git commit -m 'Remove personal contact data from public HTML'
          git push origin HEAD:redesign/v9-high-profile-2026-08-01
